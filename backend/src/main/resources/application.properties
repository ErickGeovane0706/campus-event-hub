spring.application.name=campus-event-hub

# Carrega variaveis do arquivo .env (pasta backend/), se existir
spring.config.import=optional:file:.env[.properties]

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_event_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate - o schema e controlado pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=${SERVER_PORT:8080}

# URL do frontend (usada na configuracao de CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
